name: E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    # The suite builds the app itself (playwright.config.ts webServer) and then runs both projects.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only Chromium is needed: the app blocks non-Chromium browsers by design (plan D5).
      - run: npx playwright install --with-deps chromium
        working-directory: apps/fxblox-web
      - run: npx playwright test
        working-directory: apps/fxblox-web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/fxblox-web/playwright-report
          retention-days: 7
